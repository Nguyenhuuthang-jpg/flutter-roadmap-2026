<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter Roadmap 2026</title>
  <meta name="description" content="Sơ đồ lộ trình học Flutter, cập nhật theo Flutter 3.50 và Dart 3.14 (11/2026).">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="logo" aria-hidden="true">◆</span>Flutter Roadmap <span class="ver">3.50 · Dart 3.14</span></div>
      <div class="top-right">
        <div class="overall" title="Tiến độ chung">
          <div class="bar"><span id="bar-fill"></span></div>
          <span id="progress-text">0%</span>
        </div>
        <button id="theme" class="icon-btn" aria-label="Đổi giao diện sáng/tối">🌓</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <main class="map-wrap">
      <h1>Lộ trình học Flutter</h1>
      <p class="hint">Bấm vào một ô trên sơ đồ để xem tài liệu.</p>
      <div id="map" class="map" role="list"></div>
    </main>

    <aside id="panel" class="panel" aria-live="polite">
      <div id="panel-body"></div>
    </aside>
  </div>

  <div id="scrim" class="scrim" hidden></div>

  <footer class="foot">
    Dựa trên <a href="https://github.com/olexale/flutter_roadmap" target="_blank" rel="noopener">olexale/flutter_roadmap</a> ·
    <span class="tag new">Mới</span> cập nhật 2025–2026 ·
    <span class="tag deprecated">Lỗi thời</span> không còn khuyến nghị
  </footer>

  <script src="script.js"></script>
</body>
</html>
